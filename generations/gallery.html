<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generate — Media Library</title>
<style>
  :root {
    --bg: #0e0e10;
    --card: #1a1a1d;
    --border: #2a2a2e;
    --text: #e8e8ea;
    --muted: #8a8a90;
    --accent: #6ea8fe;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f4f2;
      --card: #ffffff;
      --border: #e0e0dd;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #2f6fed;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Inter, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    text-transform: uppercase;
    color: var(--muted);
  }
  #count { color: var(--muted); font-size: 12px; }
  #styles-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  #styles-btn:hover { border-color: var(--accent); }

  #wall {
    columns: 4 260px;
    column-gap: 16px;
    padding: 20px 28px 60px;
  }
  @media (max-width: 1100px) { #wall { columns: 3 220px; } }
  @media (max-width: 700px) { #wall { columns: 2 160px; } }
  @media (max-width: 420px) { #wall { columns: 1; } }

  .tile {
    break-inside: avoid;
    margin-bottom: 16px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--card);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .tile:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  }
  .tile img, .tile video {
    display: block;
    width: 100%;
    height: auto;
  }
  .tile .meta {
    padding: 8px 10px;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #empty {
    color: var(--muted);
    padding: 60px 28px;
    text-align: center;
    font-size: 14px;
  }

  #lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 40px;
  }
  #lightbox.open { display: flex; }
  #lightbox img, #lightbox video {
    max-width: 100%;
    max-height: 100%;
    border-radius: 10px;
  }

  #styles-panel {
    position: fixed;
    top: 0;
    right: -340px;
    width: 320px;
    height: 100%;
    background: var(--card);
    border-left: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
    transition: right 0.2s ease;
    z-index: 60;
  }
  #styles-panel.open { right: 0; }
  #styles-panel h2 { font-size: 14px; text-transform: uppercase; color: var(--muted); margin-top: 0; }
  .style-item {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .style-item:hover { border-color: var(--accent); }
  .style-item .name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .style-item .prompt { font-size: 12px; color: var(--muted); }

  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 70;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>Generate — Media Library</h1>
  <div style="display:flex; align-items:center; gap:14px;">
    <span id="count"></span>
    <button id="styles-btn">Styles</button>
  </div>
</header>

<div id="wall"></div>
<div id="empty" style="display:none;">Nothing here yet. Run <code>/generate</code> and it'll show up.</div>

<div id="lightbox"></div>

<div id="styles-panel">
  <h2>Styles</h2>
  <div id="styles-list"></div>
</div>

<div id="toast"></div>

<script>
const wall = document.getElementById("wall");
const empty = document.getElementById("empty");
const countEl = document.getElementById("count");
const lightbox = document.getElementById("lightbox");
const stylesBtn = document.getElementById("styles-btn");
const stylesPanel = document.getElementById("styles-panel");
const stylesList = document.getElementById("styles-list");
const toast = document.getElementById("toast");

let knownFiles = "";

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1800);
}

function render(items) {
  const sig = items.map(i => i.file).join(",");
  if (sig === knownFiles) return;
  knownFiles = sig;

  wall.innerHTML = "";
  empty.style.display = items.length ? "none" : "block";
  countEl.textContent = items.length ? `${items.length} items` : "";

  for (const item of items) {
    const tile = document.createElement("div");
    tile.className = "tile";

    let media;
    if (item.type === "video") {
      media = document.createElement("video");
      media.src = "/" + encodeURIComponent(item.file);
      media.muted = true;
      media.loop = true;
      media.playsInline = true;
      media.preload = "metadata";
      tile.addEventListener("mouseenter", () => media.play().catch(() => {}));
      tile.addEventListener("mouseleave", () => { media.pause(); media.currentTime = 0; });
    } else {
      media = document.createElement("img");
      media.src = "/" + encodeURIComponent(item.file);
      media.loading = "lazy";
    }
    tile.appendChild(media);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = item.meta?.model ? `${item.meta.model} · ${item.file}` : item.file;
    tile.appendChild(meta);

    tile.addEventListener("click", () => openLightbox(item));
    wall.appendChild(tile);
  }
}

function openLightbox(item) {
  lightbox.innerHTML = "";
  let big;
  if (item.type === "video") {
    big = document.createElement("video");
    big.src = "/" + encodeURIComponent(item.file);
    big.controls = true;
    big.autoplay = true;
  } else {
    big = document.createElement("img");
    big.src = "/" + encodeURIComponent(item.file);
  }
  lightbox.appendChild(big);
  lightbox.classList.add("open");
}
lightbox.addEventListener("click", (e) => {
  if (e.target === lightbox) {
    lightbox.classList.remove("open");
    lightbox.innerHTML = "";
  }
});

stylesBtn.addEventListener("click", () => stylesPanel.classList.toggle("open"));

async function loadStyles() {
  const res = await fetch("/api/styles");
  const styles = await res.json();
  stylesList.innerHTML = "";
  for (const s of styles) {
    const el = document.createElement("div");
    el.className = "style-item";
    el.innerHTML = `<div class="name">${s.name}</div><div class="prompt">${s.prompt}</div>`;
    el.addEventListener("click", async () => {
      const refsLine = s.refs?.length ? `\nrefs: ${s.refs.join(", ")}` : "";
      await navigator.clipboard.writeText(s.prompt + refsLine);
      showToast(`Copied "${s.name}"`);
    });
    stylesList.appendChild(el);
  }
}

async function poll() {
  try {
    const res = await fetch("/api/media");
    render(await res.json());
  } catch {}
}

poll();
loadStyles();
setInterval(poll, 4000);
</script>

</body>
</html>
